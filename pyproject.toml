[project]
name = "slack-qa-agent"
version = "0.1.0"
description = "A production-minded Slack Q&A agent grounded in a SQLite knowledge base."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiohttp>=3.12,<4",
  "aiosqlite>=0.21,<1",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "inngest>=0.5.19,<1",
  "langchain-openai>=1,<2",
  "langsmith>=0.11,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "slack-bolt>=1.30,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_qa_agent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local infrastructure or a supplied knowledge database",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["slack_qa_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["inngest.*", "slack_bolt.*", "langgraph.checkpoint.postgres.*"]
ignore_missing_imports = true
