name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: slack_qa
          POSTGRES_USER: slack_qa
          POSTGRES_PASSWORD: slack_qa_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slack_qa -d slack_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://slack_qa:slack_qa_dev@localhost:5432/slack_qa
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Migration smoke test
        run: |
          uv run alembic upgrade head
          uv run python -m slack_qa_agent.persistence.checkpoints
      - name: Test
        run: uv run pytest --cov=slack_qa_agent --cov-report=term-missing
