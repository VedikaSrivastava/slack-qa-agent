worker_processes 1;

events {
    worker_connections 128;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    server {
        listen 8080;

        # The public development tunnel must expose only Slack's signed event receiver. Inngest
        # dev mode intentionally disables signature verification, so its endpoint stays private.
        location = /slack/events {
            limit_except POST {
                deny all;
            }

            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            return 404;
        }
    }
}
