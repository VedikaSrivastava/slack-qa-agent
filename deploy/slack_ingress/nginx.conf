worker_processes 1;

events {
    worker_connections 128;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;

    # Docker's embedded DNS. Resolving upstreams at request time keeps this container
    # working when `app` is recreated by a rebuild and comes back on a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # The public development tunnel must expose only Slack's signed event receiver. Inngest
        # dev mode intentionally disables signature verification, so its endpoint stays private.
        location = /slack/events {
            limit_except POST {
                deny all;
            }

            # A variable in proxy_pass defers the DNS lookup to request time; it also
            # disables the implicit URI pass-through, hence the explicit $request_uri.
            set $slack_upstream http://app:8000;
            proxy_pass $slack_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }

        location / {
            return 404;
        }
    }
}
